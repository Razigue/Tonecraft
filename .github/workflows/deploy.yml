# The deployed site is a pure function of the commit: everything it serves is
# either committed source or derived from it by this job, so a rollback is a
# revert.
#
# The chain (`public/dsp/chain.wasm`) is the one binary in the tree: dsp/ and
# the pinned NAM core, compiled by `scripts/build-dsp.mjs`. Committing it rather
# than building it here keeps this job free of a C++ toolchain and of network
# access beyond npm, and keeps a clean checkout deployable. Tonecraft Engine
# runs the same file; `.github/workflows/engine.yml` builds and tests that.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # schema/params.ts is the single source of truth (AD-7). This asserts that
      # `engine/` and `app/` have not drifted from it, that every preset names a
      # capture and a cabinet that exist, and that every capture carries a
      # measured trim — all of which fail silently in the product.
      - name: Check the schema and its consumers
        run: npm run check

      - name: Test
        run: npm test

      # The only hand-written non-linearity in the chain. Regressing its
      # oversampling or its anti-aliasing does not break a test, it just sounds
      # cheap, so the figure is printed on every build.
      - name: Measure the boost's aliasing
        run: npm run measure

      # Built at the root first, because the browser test serves dist/ itself
      # from '/'. It is the only test that can see the failure that matters:
      # when the NAM engine does not come up, the chain passes the dry signal
      # through — there is sound, the meters move, and nothing looks wrong. It
      # asserts on the worklet's own confirmation that the capture is running.
      - name: Build
        run: npm run build

      # Playwright downloads its own Chromium. The runner's unrelated Chrome
      # APT feed can publish inconsistent indexes and break dependency setup.
      - name: Disable the unused Google Chrome APT repository
        run: |
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: End-to-end in a browser
        run: npm run test:browser

      # The reader and the recorder, in the same served build: importing a
      # score, recording the input and downloading both WAVs are things only a
      # real browser does — the worker export, the download and the file picker
      # have no equivalent in Node.
      - name: The tab reader and the recorder in a browser
        run: npm run test:studio

      # GitHub Pages serves this under /<repo>/ unless a custom domain is set,
      # so what is deployed is rebuilt against that base.
      - name: Rebuild for deployment
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
