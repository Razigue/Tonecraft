# AD-15: CI compiles, renders and deploys. Nothing binary is committed, so the
# deployed site is a pure function of the commit and a rollback is a revert.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: 24

  # Pinned exactly, never a floating tag. The toolchain version is part of what
  # makes a build reproducible, and AD-4 forbids relaxed SIMD — a newer
  # toolchain could otherwise start emitting it. Unused until story 1.3, which
  # confirms this version against a real build.
  EMSDK_VERSION: 6.0.4

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # AD-7: schema/params.ts is the single source of truth. Generate the C++
      # header, then assert it matches — catching a header edited by hand, and
      # a generator that is not deterministic.
      - name: Generate and verify the parameter header
        run: |
          npm run schema:generate
          npm run schema:check

      - name: Typecheck
        run: npx tsc --noEmit

      # Story 1.3 adds the WASM build, using EMSDK_VERSION above.
      # Story 4.1 adds the Node renderer between the WASM build and astro build.

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
